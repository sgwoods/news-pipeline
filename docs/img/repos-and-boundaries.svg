<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 440" width="970" height="440" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI Briefing: repositories and privacy boundaries</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
  <rect width="970" height="440" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1d2330">Repositories and privacy boundaries</text>
  <text x="24" y="58" font-size="13" fill="#5b6472">One private working folder; each public repository receives only what its own exporter writes, after a scan.</text>

  <rect x="24" y="84" width="300" height="330" rx="14" fill="#fbeeee" stroke="#d99"/>
  <text x="44" y="110" font-size="12" font-weight="700" fill="#b33a3a" letter-spacing="1">PRIVATE · the Mac</text>
  <g font-size="12.5" fill="#1d2330">
    <rect x="44" y="124" width="260" height="70" rx="8" fill="#fff" stroke="#d99"/><text x="58" y="146" font-weight="700">Working folder (production)</text><text x="58" y="166" font-size="12" fill="#5b6472">code, archive, state, editorial inputs</text><text x="58" y="184" font-size="12" fill="#5b6472">backup → sgwoods/news-pipeline-data</text>
    <rect x="44" y="206" width="260" height="56" rx="8" fill="#fff" stroke="#d99"/><text x="58" y="228" font-weight="700">owner.yaml, config.yaml</text><text x="58" y="248" font-size="12" fill="#5b6472">personal values live here, not in code</text>
    <rect x="44" y="274" width="260" height="56" rx="8" fill="#fff" stroke="#d99"/><text x="58" y="296" font-weight="700">People and archive</text><text x="58" y="316" font-size="12" fill="#5b6472">subscribers, feedback, fetched articles</text>
    <rect x="44" y="342" width="260" height="56" rx="8" fill="#fff" stroke="#d99"/><text x="58" y="364" font-weight="700">Development checkout (planned)</text><text x="58" y="384" font-size="12" fill="#5b6472">branch dev, staging: cannot send</text>
  </g>

  <g font-size="12.5" fill="#1d2330">
    <rect x="380" y="100" width="190" height="96" rx="10" fill="#fdf2e3" stroke="#e0a85a"/><text x="394" y="124" font-weight="700">./np push-code</text><text x="394" y="144" font-size="11.5" fill="#5b6472">allowlist, strip PRIVATE,</text><text x="394" y="160" font-size="11.5" fill="#5b6472">placeholders, scan, tests,</text><text x="394" y="176" font-size="11.5" fill="#5b6472">Steven's approval</text>
    <rect x="380" y="212" width="190" height="80" rx="10" fill="#fdf2e3" stroke="#e0a85a"/><text x="394" y="236" font-weight="700">publish</text><text x="394" y="256" font-size="11.5" fill="#5b6472">release gate, site privacy</text><text x="394" y="272" font-size="11.5" fill="#5b6472">scan, then the email</text>
    <rect x="380" y="308" width="190" height="80" rx="10" fill="#fdf2e3" stroke="#e0a85a"/><text x="394" y="332" font-weight="700">./np hub push</text><text x="394" y="352" font-size="11.5" fill="#5b6472">two-file allowlist, only</text><text x="394" y="368" font-size="11.5" fill="#5b6472">for the released code</text>
  </g>

  <g font-size="12.5" fill="#1d2330">
    <rect x="626" y="100" width="310" height="96" rx="10" fill="#e9f6ee" stroke="#7fbf97"/><text x="640" y="124" font-weight="700">sgwoods/news-pipeline (public code)</text><text x="640" y="144" font-size="12" fill="#5b6472">tagged releases, MIT, example configs</text><text x="640" y="162" font-size="12" fill="#5b6472">no data, no private names or settings</text>
    <rect x="626" y="212" width="310" height="80" rx="10" fill="#e9f6ee" stroke="#7fbf97"/><text x="640" y="236" font-weight="700">sgwoods/ai-briefing (site)</text><text x="640" y="256" font-size="12" fill="#5b6472">editions, podcast, deep dives, release notes</text><text x="640" y="274" font-size="12" fill="#5b6472">+ planned staging site (development preview)</text>
    <rect x="626" y="308" width="310" height="80" rx="10" fill="#e9f6ee" stroke="#7fbf97"/><text x="640" y="332" font-weight="700">sgwoods/public (project hub)</text><text x="640" y="352" font-size="12" fill="#5b6472">data/projects/ai-briefing.json, ai-briefing.html;</text><text x="640" y="370" font-size="12" fill="#5b6472">the hub checks them against the public code</text>
  </g>
  <g stroke="#5b6472" stroke-width="1.3" fill="none" marker-end="url(#a)">
    <path d="M304 159 C340 159 340 148 378 148"/><path d="M304 159 C345 159 340 252 378 252"/><path d="M304 159 C350 159 345 348 378 348"/>
    <path d="M570 148 H624"/><path d="M570 252 H624"/><path d="M570 348 H624"/>
    <path d="M936 348 H948 V148 H938" stroke-dasharray="4 4"/>
  </g>
  <text x="961" y="246" font-size="11" fill="#5b6472" transform="rotate(-90 961 246)" text-anchor="middle">compares</text>
</svg>
