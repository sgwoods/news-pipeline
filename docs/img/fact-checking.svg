<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI Briefing: grounding and fact checking</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1d2330">Grounding and fact checking</text>
  <text x="24" y="58" font-size="13" fill="#5b6472">Each layer works on the output of the one before. Unverifiable sentences are cut and the edition still goes; only privacy blocks.</text>
  <g font-size="12.5" fill="#1d2330">
    <rect x="24" y="86" width="140" height="150" rx="10" fill="#eef3fb" stroke="#9db4d8"/><text x="36" y="110" font-weight="700">1 · Ground</text><text x="36" y="132" font-size="11.5" fill="#5b6472">every item archived</text><text x="36" y="148" font-size="11.5" fill="#5b6472">thin items: article</text><text x="36" y="164" font-size="11.5" fill="#5b6472">read in full</text><text x="36" y="180" font-size="11.5" fill="#5b6472">source profiles:</text><text x="36" y="196" font-size="11.5" fill="#5b6472">how a source knows</text>
    <line x1="164" y1="161" x2="178" y2="161" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="178" y="86" width="140" height="150" rx="10" fill="#eef3fb" stroke="#9db4d8"/><text x="190" y="110" font-weight="700">2 · Judge</text><text x="190" y="132" font-size="11.5" fill="#5b6472">critique verdict per</text><text x="190" y="148" font-size="11.5" fill="#5b6472">claim: holds, mixed,</text><text x="190" y="164" font-size="11.5" fill="#5b6472">overstated,</text><text x="190" y="180" font-size="11.5" fill="#5b6472">unsupported,</text><text x="190" y="196" font-size="11.5" fill="#5b6472">unverified</text><text x="190" y="212" font-size="11.5" fill="#5b6472">Must read: evidence</text>
    <line x1="318" y1="161" x2="332" y2="161" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="332" y="86" width="140" height="150" rx="10" fill="#fdf2e3" stroke="#e0a85a"/><text x="344" y="110" font-weight="700">3 · Check the text</text><text x="344" y="132" font-size="11.5" fill="#5b6472">figures traced to</text><text x="344" y="148" font-size="11.5" fill="#5b6472">their sources</text><text x="344" y="164" font-size="11.5" fill="#5b6472">search before cut</text><text x="344" y="180" font-size="11.5" fill="#5b6472">numbers add up</text><text x="344" y="196" font-size="11.5" fill="#5b6472">quotes word for word</text>
    <line x1="472" y1="161" x2="486" y2="161" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="486" y="86" width="140" height="150" rx="10" fill="#fdf2e3" stroke="#e0a85a"/><text x="498" y="110" font-weight="700">4 · First lines</text><text x="498" y="132" font-size="11.5" fill="#5b6472">summary, why today</text><text x="498" y="148" font-size="11.5" fill="#5b6472">agree with the body</text><text x="498" y="164" font-size="11.5" fill="#5b6472">roles only if the</text><text x="498" y="180" font-size="11.5" fill="#5b6472">source states them</text><text x="498" y="196" font-size="11.5" fill="#5b6472">else: neutral line</text><text x="498" y="212" font-size="11.5" fill="#5b6472">pre-send: each claim</text><text x="498" y="228" font-size="11.5" fill="#5b6472">re-checked, fixed</text>
    <line x1="626" y1="161" x2="640" y2="161" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="640" y="86" width="140" height="150" rx="10" fill="#fbecec" stroke="#d99191"/><text x="652" y="110" font-weight="700">5 · Privacy gate</text><text x="652" y="132" font-size="11.5" fill="#5b6472">private names, owner</text><text x="652" y="148" font-size="11.5" fill="#5b6472">addresses, trackers,</text><text x="652" y="164" font-size="11.5" fill="#5b6472">board-seat notes</text><text x="652" y="180" font-size="11.5" fill="#5b6472">removed or blocked</text><text x="652" y="196" font-size="11.5" fill="#5b6472">(this one blocks)</text>
    <line x1="780" y1="161" x2="794" y2="161" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="794" y="86" width="140" height="150" rx="10" fill="#e9f6ee" stroke="#7fbf97"/><text x="806" y="110" font-weight="700">6 · After shipping</text><text x="806" y="132" font-size="11.5" fill="#5b6472">shipped text is fixed</text><text x="806" y="148" font-size="11.5" fill="#5b6472">changes only as a</text><text x="806" y="164" font-size="11.5" fill="#5b6472">visible correction</text><text x="806" y="180" font-size="11.5" fill="#5b6472">live check after push</text><text x="806" y="196" font-size="11.5" fill="#5b6472">weekly review</text><text x="806" y="212" font-size="11.5" fill="#5b6472">accuracy audit</text>
    <text x="24" y="268" font-size="12" fill="#5b6472">Sentences dropped at 3 and 4 are logged with the reason. The scorecard counts figures found in no source (target 0).</text>
    <text x="24" y="286" font-size="12" fill="#5b6472">Modules: reader.py, stages.py, factcheck.py, factsearch.py, numbers.py, consistency.py, audit.py, links.py, mailer.py, publish.py, shipped.py, review.py</text>
  </g>
</svg>
