<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>AI Briefing: run queue</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
  <rect width="960" height="360" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="700" fill="#1d2330">Run queue (from v0.1.12)</text>
  <text x="24" y="58" font-size="13" fill="#5b6472">Claude queues a named job; the Mac runs it; Steven decides. Jobs are data, never commands.</text>
  <g font-size="12.5" fill="#1d2330">
    <rect x="24" y="90" width="190" height="120" rx="10" fill="#eef3fb" stroke="#9db4d8"/><text x="36" y="114" font-weight="700">Claude (chat)</text><text x="36" y="136" font-size="11.5" fill="#5b6472">writes data/queue/</text><text x="36" y="152" font-size="11.5" fill="#5b6472">pending/&lt;id&gt;.json:</text><text x="36" y="168" font-size="11.5" fill="#5b6472">a recipe + arguments</text><text x="36" y="184" font-size="11.5" fill="#5b6472">quotes Steven's yes</text><text x="36" y="200" font-size="11.5" fill="#5b6472">for chat-tier jobs</text>
    <line x1="214" y1="150" x2="246" y2="150" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="246" y="90" width="200" height="120" rx="10" fill="#fdf2e3" stroke="#e0a85a"/><text x="258" y="114" font-weight="700">Runner on the Mac</text><text x="258" y="136" font-size="11.5" fill="#5b6472">launchd, every minute</text><text x="258" y="152" font-size="11.5" fill="#5b6472">allowlisted recipes only</text><text x="258" y="168" font-size="11.5" fill="#5b6472">arguments validated</text><text x="258" y="184" font-size="11.5" fill="#5b6472">one job at a time</text><text x="258" y="200" font-size="11.5" fill="#5b6472">waits out 03:30-08:30</text>
    <line x1="446" y1="150" x2="478" y2="110" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/><line x1="446" y1="150" x2="478" y2="170" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/><line x1="446" y1="150" x2="478" y2="240" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="478" y="78" width="230" height="52" rx="10" fill="#e9f6ee" stroke="#7fbf97"/><text x="490" y="102" font-weight="700">auto</text><text x="490" y="124" font-size="11.5" fill="#5b6472">checks, audits, remaster: run at once</text>
    <rect x="478" y="142" width="230" height="52" rx="10" fill="#eef3fb" stroke="#9db4d8"/><text x="490" y="166" font-weight="700">chat</text><text x="490" y="188" font-size="11.5" fill="#5b6472">correct, publish: Steven's yes in chat</text>
    <rect x="478" y="206" width="230" height="68" rx="10" fill="#fbecec" stroke="#d99191"/><text x="490" y="230" font-weight="700">mac</text><text x="490" y="252" font-size="11.5" fill="#5b6472">ship, release: chat yes or Approve;</text><text x="490" y="268" font-size="11.5" fill="#5b6472">rollback, public push: Approve</text>
    <line x1="708" y1="175" x2="740" y2="175" stroke="#5b6472" stroke-width="1.5" marker-end="url(#a)"/>
    <rect x="740" y="90" width="196" height="170" rx="10" fill="#e9f6ee" stroke="#7fbf97"/><text x="752" y="114" font-weight="700">Steps and results</text><text x="752" y="136" font-size="11.5" fill="#5b6472">./np in dev or production</text><text x="752" y="152" font-size="11.5" fill="#5b6472">approved steps run with</text><text x="752" y="168" font-size="11.5" fill="#5b6472">presence for that job only</text><text x="752" y="184" font-size="11.5" fill="#5b6472">logs/runner-&lt;id&gt;.txt</text><text x="752" y="200" font-size="11.5" fill="#5b6472">data/queue/done/&lt;id&gt;.json</text><text x="752" y="216" font-size="11.5" fill="#5b6472">Claude reads and reports</text>
    <text x="24" y="312" font-size="12" fill="#5b6472">Nothing on disk stands in for the Approve click (pipeline/presence.py); a ship or release may run on Steven's quoted chat yes.</text>
    <text x="24" y="330" font-size="12" fill="#5b6472">The runner refuses if production code differs from the release. Release invariant 10 checks the recipes and the runner's code.</text>
    <text x="24" y="348" font-size="12" fill="#5b6472">Unanswered approvals lapse at 20:00.</text>
  </g>
</svg>
